<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاموس القطوس — Dictionnaire le Catouss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/libertinus-math@latest/latin-400-normal.min.css">
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS — LIGHT MODE ONLY
═══════════════════════════════════════════════ */
:root {
  --bg:           #f6f9fb;
  --card-bg:      #ffffff;
  --controls-bg:  #eef4f9;
  --alpha-bg:     #f6f9fb;
  --ink:          #16324f;
  --muted:        #5c7488;
  --border:       #d7e3ec;
  --accent:       #1f6f9e;
  --accent-soft:  rgba(31,111,158,.12);
  --warm:         #d9a441;
  --highlight:    rgba(31,111,158,.18);
  --arabic-bg:    #eef4f9;
  --count-bg:     #d7e3ec;
  --shadow-card:  0 2px 12px rgba(22,50,79,.08);
  --shadow-hover: 0 8px 28px rgba(22,50,79,.16);
  --radius-card:  14px;
  --radius-btn:   8px;
  --radius-pill:  999px;
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Libertinus Math', Georgia, serif;
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ═══════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════ */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes badgePop {
  0%   { opacity: 0; transform: scale(.85); }
  60%  { transform: scale(1.06); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ═══════════════════════════════════════════════
   HEADER — IMAGE BANNER
═══════════════════════════════════════════════ */
header {
  height: 160px;
  background-image: url('banner.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
@media (max-width: 520px) {
  header { height: 100px; }
}

/* ═══════════════════════════════════════════════
   CONTROLS BAR
═══════════════════════════════════════════════ */
.controls {
  background: var(--controls-bg);
  border-bottom: 1px solid var(--border);
  padding: 1.2rem 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  gap: 0.85rem;
  flex-wrap: wrap;
  align-items: center;
  box-shadow: 0 2px 16px rgba(30,27,24,.06);
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-icon {
  position: absolute;
  left: 1rem; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  fill: var(--muted);
  pointer-events: none;
}
.spinner {
  position: absolute;
  right: 1rem; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .5s linear infinite;
  display: none;
  pointer-events: none;
}
.spinner.active { display: block; }
input[type=search] {
  width: 100%;
  padding: 0.72rem 2.8rem 0.72rem 2.6rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--bg);
  font-family: 'Libertinus Math', serif;
  font-size: 1.05rem;
  color: var(--ink);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  box-shadow: 0 1px 6px rgba(30,27,24,.04);
}
input[type=search]::placeholder { color: var(--muted); opacity: .8; }
input[type=search]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 6px rgba(30,27,24,.04);
}
input[type=search].arabic-mode {
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', serif;
  font-size: 1.2rem;
  padding: 0.72rem 2.6rem 0.72rem 2.8rem;
}
select {
  padding: 0.72rem 1.4rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--bg);
  font-family: 'Libertinus Math', serif;
  font-size: 0.98rem;
  color: var(--ink);
  cursor: pointer;
  outline: none;
  transition: border-color .2s;
}
select:focus { border-color: var(--accent); }
.count-badge {
  font-size: 0.82rem;
  font-family: 'Libertinus Math', serif;
  background: var(--count-bg);
  color: var(--muted);
  padding: 0.28rem 0.9rem;
  border-radius: var(--radius-pill);
  white-space: nowrap;
  margin-left: auto;
  letter-spacing: 0.02em;
}
.count-badge.pop { animation: badgePop .3s ease forwards; }
@media (max-width: 520px) {
  .controls { padding: 0.85rem 1rem; gap: 0.6rem; }
  .count-badge { margin-left: 0; }
}

/* ═══════════════════════════════════════════════
   ALPHABET NAV
═══════════════════════════════════════════════ */
.alpha-nav {
  background: var(--alpha-bg);
  border-bottom: 1px solid var(--border);
  padding: 0.65rem 1.5rem;
  display: flex;
  gap: 0.2rem;
  justify-content: center;
  flex-wrap: wrap;
}
@media (max-width: 640px) {
  .alpha-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    justify-content: flex-start;
    padding: 0.6rem 0.75rem;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .alpha-nav::-webkit-scrollbar { display: none; }
}
.alpha-btn {
  background: none;
  border: 1.5px solid transparent;
  border-radius: var(--radius-btn);
  padding: 0.3rem 0.6rem;
  font-size: 0.84rem;
  font-family: 'Libertinus Math', serif;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  flex-shrink: 0;
}
.alpha-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.alpha-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(31,111,158,.25); }

/* ═══════════════════════════════════════════════
   LETTER SECTIONS
═══════════════════════════════════════════════ */
.letter-section {
  padding: 0.5rem 2rem 0;
  max-width: 1440px;
  margin: 0 auto;
}
.letter-heading {
  font-family: 'Libertinus Math', serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--accent);
  border-bottom: 1.5px solid var(--border);
  padding: 2rem 0 0.6rem;
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: flex;
  align-items: baseline;
  gap: 0.85rem;
}
.letter-heading span {
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
  font-family: 'Libertinus Math', serif;
  font-weight: 400;
  letter-spacing: 0;
}

/* ═══════════════════════════════════════════════
   ENTRIES GRID
═══════════════════════════════════════════════ */
.entries-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 1.2rem;
  padding: 1rem 2rem 2rem;
  max-width: 1440px;
  margin: 0 auto;
  min-height: 120px;
}
@media (max-width: 520px) {
  .entries-grid { grid-template-columns: 1fr; padding: 0.75rem 1rem 1.5rem; gap: 0.85rem; }
  .letter-section { padding: 0.5rem 1rem 0; }
}

/* ═══════════════════════════════════════════════
   ENTRY CARD
═══════════════════════════════════════════════ */
.entry-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 1.4rem 1.5rem 1.25rem;
  position: relative;
  transition: transform .18s, box-shadow .18s, border-color .18s;
  overflow: hidden;
  animation: cardIn .2s ease both;
}
.entries-grid .entry-card:nth-child(1)  { animation-delay: 0s; }
.entries-grid .entry-card:nth-child(2)  { animation-delay: .02s; }
.entries-grid .entry-card:nth-child(3)  { animation-delay: .04s; }
.entries-grid .entry-card:nth-child(4)  { animation-delay: .06s; }
.entries-grid .entry-card:nth-child(5)  { animation-delay: .08s; }
.entries-grid .entry-card:nth-child(n+6){ animation-delay: .1s; }
.entry-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--border);
  border-radius: var(--radius-card) 0 0 var(--radius-card);
  transition: background .18s;
}
.entry-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
.entry-card:hover::before { background: var(--accent); }

/* Entry image (optional) */
.entry-image {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 0.75rem;
  display: block;
}

/* 1 — Latin headword */
.entry-latin {
  font-family: 'Libertinus Math', serif;
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.03em;
  line-height: 1.25;
  margin-bottom: 0.65rem;
}
/* 2 — Arabic word */
.entry-arabic {
  font-size: 1.8rem;
  color: var(--ink);
  text-align: right;
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', 'Arabic Typesetting', serif;
  font-weight: 400;
  line-height: 1.7;
  margin-bottom: 0.65rem;
  background: var(--arabic-bg);
  border-radius: 8px;
  padding: 0.35rem 0.75rem 0.25rem;
  letter-spacing: 0.01em;
}
/* 3 — French definition */
.entry-french {
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
  line-height: 1.55;
  padding-top: 0.5rem;
  border-top: 1px dashed var(--border);
}
mark {
  background: var(--highlight);
  border-radius: 3px;
  padding: 0 1px;
  color: inherit;
}

/* ═══════════════════════════════════════════════
   WORD OF THE DAY
═══════════════════════════════════════════════ */
.wotd {
  padding: 1.1rem 2rem 0;
  max-width: 1440px;
  margin: 0 auto;
}
.wotd-card {
  background: linear-gradient(135deg, var(--accent-soft), var(--card-bg) 65%);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 1.15rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.4rem;
  flex-wrap: wrap;
  box-shadow: var(--shadow-card);
  animation: cardIn .25s ease both;
}
.wotd-label {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  min-width: 130px;
}
.wotd-label-ar {
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent);
}
.wotd-label-fr {
  font-family: 'Libertinus Math', serif;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.wotd-body { flex: 1; min-width: 200px; }
.wotd-latin {
  font-family: 'Libertinus Math', serif;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.wotd-arabic {
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', serif;
  font-size: 1.4rem;
  color: var(--ink);
  margin: 0.1rem 0;
}
.wotd-french {
  font-family: 'Libertinus Math', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 0.95rem;
}
.wotd-link {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 0.55rem 1.15rem;
  font-family: 'Libertinus Math', serif;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .15s, box-shadow .15s;
}
.wotd-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
@media (max-width: 520px) {
  .wotd { padding: 0.85rem 1rem 0; }
  .wotd-card { padding: 0.9rem 1rem; }
}

/* ═══════════════════════════════════════════════
   DEEP LINKS — PERMALINK BUTTON & TARGET PULSE
═══════════════════════════════════════════════ */
.entry-card { scroll-margin-top: 210px; }
.entry-share {
  position: absolute;
  top: 0.7rem;
  right: 0.7rem;
  width: 26px;
  height: 26px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--card-bg);
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s, color .15s, border-color .15s, transform .15s;
}
.entry-card:hover .entry-share,
.entry-share:focus-visible { opacity: 1; }
.entry-share:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.08); }
.entry-share.copied { opacity: 1; color: var(--accent); border-color: var(--accent); }
@keyframes pulseHighlight {
  0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
  70%  { box-shadow: 0 0 0 14px rgba(31,111,158,0); }
  100% { box-shadow: none; }
}
.entry-card.pulse { border-color: var(--accent); animation: pulseHighlight 1.4s ease-out; }
.entry-card {
  cursor: pointer;
}
.entry-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ═══════════════════════════════════════════════
   ENTRY DETAIL PAGE
═══════════════════════════════════════════════ */
.entry-page {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 2rem 3rem;
  animation: cardIn .2s ease both;
}
.back-link {
  background: none;
  border: none;
  color: var(--accent);
  font-family: 'Libertinus Math', serif;
  font-size: 0.95rem;
  cursor: pointer;
  padding: 0.4rem 0;
  margin-bottom: 1.2rem;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  transition: transform .15s;
}
.back-link:hover { transform: translateX(-3px); }
.back-link-sep { color: var(--border); }
.back-link-ar {
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', serif;
  font-size: 1.05rem;
}
.entry-detail {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 2rem 2.2rem 2.2rem;
  box-shadow: var(--shadow-card);
}
.entry-detail .entry-share { opacity: 1; top: 1.2rem; right: 1.2rem; }
.detail-image {
  width: 100%;
  max-height: 320px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 1.25rem;
  display: block;
}
.detail-latin {
  font-family: 'Libertinus Math', serif;
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.02em;
  margin-bottom: 0.75rem;
}
.detail-arabic {
  direction: rtl;
  font-family: 'Amiri', 'Noto Naskh Arabic', serif;
  font-size: 2.4rem;
  color: var(--ink);
  background: var(--arabic-bg);
  border-radius: 10px;
  padding: 0.5rem 1rem;
  margin-bottom: 1rem;
}
.detail-french {
  font-family: 'Libertinus Math', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 1.15rem;
  line-height: 1.65;
  padding-top: 0.75rem;
  border-top: 1px dashed var(--border);
}
.detail-related { margin-top: 2rem; }
.detail-related h2 {
  font-family: 'Libertinus Math', serif;
  font-size: 1.2rem;
  color: var(--accent);
  margin-bottom: 0.85rem;
}
.detail-nav {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 2rem;
}
.detail-nav-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 0.6rem 1.2rem;
  font-family: 'Libertinus Math', serif;
  font-size: 0.9rem;
  color: var(--ink);
  cursor: pointer;
  transition: border-color .15s, color .15s, transform .15s;
  max-width: 45%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.detail-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.detail-nav-btn.prev:hover { transform: translateX(-3px); }
.detail-nav-btn.next:hover { transform: translateX(3px); }
@media (max-width: 520px) {
  .entry-page { padding: 1rem 1rem 2rem; }
  .entry-detail { padding: 1.4rem 1.3rem 1.6rem; }
  .detail-latin { font-size: 1.8rem; }
  .detail-arabic { font-size: 1.9rem; }
}

/* ═══════════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════════ */
.empty {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--muted);
  font-size: 1.2rem;
  grid-column: 1 / -1;
  font-family: 'Libertinus Math', serif;
  font-style: italic;
  letter-spacing: 0.02em;
}
.empty .empty-emoji { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; font-style: normal; }

/* ═══════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════ */
footer {
  text-align: center;
  padding: 2.5rem 2rem;
  font-size: 0.9rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-style: italic;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>

<header></header>

<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 20 20">
      <path d="M12.9 14.32a8 8 0 1 1 1.41-1.41l4.39 4.38-1.42 1.42-4.38-4.39zM8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"/>
    </svg>
    <div class="spinner" id="spinner"></div>
    <input type="search" id="searchInput" placeholder="Chercher un mot tunisien…" autocomplete="off">
  </div>
  <select id="searchMode">
    <option value="all">Tous les champs</option>
    <option value="latin">Mot tunisien (latin)</option>
    <option value="french">Traduction française</option>
    <option value="arabic">Mot arabe (عربي)</option>
  </select>
  <span class="count-badge" id="countBadge"></span>
</div>

<nav class="alpha-nav" id="alphNav"></nav>

<section class="wotd" id="wotdSection" aria-labelledby="wotdHeading"></section>

<div id="mainContent"></div>

<footer>
  Dictionnaire « le Catouss » du Tunisien  · Par Malek Yermani

// ── BUILD LETTER INDEX ──
DATA.forEach((e, i) => { e._idx = i; });
const LETTERS = [...new Set(DATA.map(e => e.latin[0]?.toLowerCase()).filter(Boolean))].sort();
const LETTER_MAP = {};
DATA.forEach(e => {
  const l = e.latin[0]?.toLowerCase();
  if (l) (LETTER_MAP[l] = LETTER_MAP[l] || []).push(e);
});

// ── DEEP LINKS: slug + hash helpers ──
function slugify(str) {
  return str.toLowerCase()
    .replace(/[’']/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}
const SLUG_INDEX = {};
DATA.forEach(e => {
  const s = slugify(e.latin);
  (SLUG_INDEX[s] = SLUG_INDEX[s] || []).push(e);
});
function makeHash(entry) { return slugify(entry.latin) + '--' + entry._idx; }
function parseHash(raw) {
  const m = raw.match(/^(.*)--(\d+)$/);
  if (m && DATA[+m[2]]) return DATA[+m[2]];
  const arr = SLUG_INDEX[raw];
  return (arr && arr[0]) || null;
}

// ── WORD OF THE DAY ──
function dayIndex(len) {
  const d = new Date();
  const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return h % len;
}
const WOTD_CANDIDATES = DATA.filter(e =>
  e.arabic && e.french && !/vulgaire/i.test(e.french) &&
  !e.latin.includes('*****') && !e.french.includes('*****')
);
const WOTD = WOTD_CANDIDATES.length ? WOTD_CANDIDATES[dayIndex(WOTD_CANDIDATES.length)] : null;

function renderWotd() {
  const el = document.getElementById('wotdSection');
  if (!WOTD) { el.remove(); return; }
  el.innerHTML = `
    <div class="wotd-card">
      <div class="wotd-label">
        <span class="wotd-label-ar">كلمة اليوم</span>
        <span class="wotd-label-fr">Le mot du jour</span>
      </div>
      <div class="wotd-body">
        <div class="wotd-latin">${WOTD.latin}</div>
        ${WOTD.arabic ? `<div class="wotd-arabic">${WOTD.arabic}</div>` : ''}
        <div class="wotd-french">${WOTD.french}</div>
      </div>
      <button class="wotd-link" onclick="goToEntry(DATA[${WOTD._idx}])">Voir l’entrée →</button>
    </div>`;
}

// ── DEEP-LINK NAVIGATION (opens a dedicated word page) ──
let currentEntry = null;

function applyEntryFromHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) { currentEntry = null; render(); return; }
  const entry = parseHash(raw);
  if (!entry) { currentEntry = null; render(); return; }
  currentEntry = entry;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', applyEntryFromHash);

function goToEntry(entry) {
  if (!entry) return;
  const newHash = '#' + makeHash(entry);
  if (location.hash === newHash) applyEntryFromHash();
  else location.hash = newHash;
}

function closeEntry() {
  currentEntry = null;
  if (location.hash) history.pushState('', document.title, location.pathname + location.search);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareEntry(idx, btn) {
  const entry = DATA[idx];
  const newHash = '#' + makeHash(entry);
  if (location.hash !== newHash) location.hash = newHash;
  const url = location.origin + location.pathname + newHash;
  if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
  if (btn) {
    const original = btn.innerHTML;
    btn.innerHTML = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1200);
  }
}

let currentLetter = null;
let currentQuery  = '';
let originalQuery = '';
let searchMode    = 'all';
let debounceTimer = null;

// ── ALPHABET NAV ──
const alphNav = document.getElementById('alphNav');
const allBtn  = document.createElement('button');
allBtn.className      = 'alpha-btn active';
allBtn.textContent    = 'Tout';
allBtn.dataset.letter = '';
allBtn.onclick = () => filterLetter('');
alphNav.appendChild(allBtn);

LETTERS.forEach(l => {
  const btn = document.createElement('button');
  btn.className      = 'alpha-btn';
  btn.textContent    = l;
  btn.dataset.letter = l;
  btn.onclick        = () => filterLetter(l);
  alphNav.appendChild(btn);
});

function filterLetter(l) {
  currentEntry = null;
  if (location.hash) history.pushState('', document.title, location.pathname + location.search);
  currentLetter = l || null;
  document.getElementById('searchInput').value = '';
  currentQuery  = '';
  originalQuery = '';
  document.querySelectorAll('.alpha-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.letter === l);
  });
  requestAnimationFrame(render);
}

// ── SPINNER & DEBOUNCED SEARCH ──
const spinner = document.getElementById('spinner');
const inp     = document.getElementById('searchInput');

inp.addEventListener('input', e => {
  const raw = e.target.value.trim();
  if (currentEntry) {
    currentEntry = null;
    if (location.hash) history.pushState('', document.title, location.pathname + location.search);
  }
  if (raw) {
    spinner.classList.add('active');
    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.alpha-btn[data-letter=""]').classList.add('active');
    currentLetter = null;
  } else {
    spinner.classList.remove('active');
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentQuery  = raw.toLowerCase();
    originalQuery = raw;
    requestAnimationFrame(() => {
      spinner.classList.remove('active');
      render();
    });
  }, 250);
});

document.getElementById('searchMode').addEventListener('change', e => {
  searchMode = e.target.value;
  if (currentEntry) {
    currentEntry = null;
    if (location.hash) history.pushState('', document.title, location.pathname + location.search);
  }
  if (searchMode === 'arabic') {
    inp.classList.add('arabic-mode');
    inp.placeholder = '…ابحث بالعربية';
  } else {
    inp.classList.remove('arabic-mode');
    inp.placeholder = 'Chercher un mot tunisien…';
  }
  render();
});

// ── COUNT BADGE ──
const countBadge = document.getElementById('countBadge');
function updateCount(n) {
  countBadge.textContent = n.toLocaleString('fr') + ' entrée' + (n !== 1 ? 's' : '');
  countBadge.classList.remove('pop');
  void countBadge.offsetWidth;
  requestAnimationFrame(() => countBadge.classList.add('pop'));
}

// ── RENDER ──
function render() {
  const wotdEl = document.getElementById('wotdSection');
  if (wotdEl) wotdEl.style.display = currentEntry ? 'none' : '';

  if (currentEntry) { renderDetail(currentEntry); return; }

  let pool = currentLetter ? (LETTER_MAP[currentLetter] || []) : DATA;
  if (currentQuery) {
    pool = pool.filter(e => {
      if (searchMode === 'latin')  return e.latin.toLowerCase().includes(currentQuery);
      if (searchMode === 'french') return e.french.toLowerCase().includes(currentQuery);
      if (searchMode === 'arabic') return e.arabic ? e.arabic.includes(originalQuery) : false;
      return e.latin.toLowerCase().includes(currentQuery) ||
             e.french.toLowerCase().includes(currentQuery) ||
             (e.arabic ? e.arabic.includes(originalQuery) : false);
    });
  }

  updateCount(pool.length);
  const main = document.getElementById('mainContent');

  if (!pool.length) {
    main.innerHTML = '<div class="entries-grid"><div class="empty"><span class="empty-emoji">🔍</span>Aucune entrée trouvée — essayez un autre mot ! ثماش منها الكلمة هذي</div></div>';
    return;
  }

  const q = currentQuery;

  if (!q) {
    const grouped = {};
    pool.forEach(e => {
      const l = e.latin[0]?.toLowerCase() || '#';
      (grouped[l] = grouped[l] || []).push(e);
    });
    let html = '';
    Object.keys(grouped).sort().forEach(l => {
      const n = grouped[l].length;
      html += `<div class="letter-section">
        <div class="letter-heading">${l.toUpperCase()} <span>${n} entrée${n>1?'s':''}</span></div>
      </div>
      <div class="entries-grid">${grouped[l].map(c => cardHTML(c, '')).join('')}</div>`;
    });
    main.innerHTML = html;
  } else {
    main.innerHTML = '<div class="entries-grid">' + pool.map(c => cardHTML(c, q)).join('') + '</div>';
  }
}

function hl(text, q) {
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(escaped, 'gi');
  return text.replace(re, '<mark>$&</mark>');
}

function cardHTML(e, q) {
  const img = e.image
    ? `<img class="entry-image" src="${e.image}" alt="${e.latin}" loading="lazy">`
    : '';
  return `<div class="entry-card" id="entry-${e._idx}" tabindex="0" role="link"
    aria-label="Voir l’entrée ${e.latin}"
    onclick="goToEntry(DATA[${e._idx}])"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToEntry(DATA[${e._idx}]);}">
    <button class="entry-share" onclick="event.stopPropagation();shareEntry(${e._idx}, this)" title="Copier le lien de cette entrée" aria-label="Copier le lien de cette entrée">🔗</button>
    ${img}<div class="entry-latin">${hl(e.latin, q)}</div>
    ${e.arabic ? `<div class="entry-arabic">${e.arabic}</div>` : ''}
    <div class="entry-french">${hl(e.french, q)}</div>
  </div>`;
}

// ── DETAIL PAGE ──
function siblingEntries(entry) {
  const letter = entry.latin[0]?.toLowerCase();
  const group  = LETTER_MAP[letter] || [];
  const i = group.indexOf(entry);
  return { prev: i > 0 ? group[i - 1] : null, next: i >= 0 && i < group.length - 1 ? group[i + 1] : null };
}

function renderDetail(entry) {
  countBadge.textContent = '';
  const main = document.getElementById('mainContent');
  const { prev, next } = siblingEntries(entry);
  const homographs = (SLUG_INDEX[slugify(entry.latin)] || []).filter(h => h._idx !== entry._idx);

  main.innerHTML = `
    <div class="entry-page">
      <button class="back-link" onclick="closeEntry()">
        <span class="back-link-fr">← Retour au dictionnaire</span>
        <span class="back-link-sep">·</span>
        <span class="back-link-ar">ارجع للقاموس</span>
      </button>
      <article class="entry-detail" id="entry-${entry._idx}">
        <button class="entry-share" onclick="shareEntry(${entry._idx}, this)" title="Copier le lien de cette entrée" aria-label="Copier le lien de cette entrée">🔗</button>
        ${entry.image ? `<img class="detail-image" src="${entry.image}" alt="${entry.latin}" loading="lazy">` : ''}
        <h1 class="detail-latin">${entry.latin}</h1>
        ${entry.arabic ? `<div class="detail-arabic">${entry.arabic}</div>` : ''}
        <p class="detail-french">${entry.french}</p>
      </article>
      ${homographs.length ? `
      <div class="detail-related">
        <h2>Autres sens de « ${entry.latin} »</h2>
        <div class="entries-grid">${homographs.map(h => cardHTML(h, '')).join('')}</div>
      </div>` : ''}
      <nav class="detail-nav">
        ${prev ? `<button class="detail-nav-btn prev" onclick="goToEntry(DATA[${prev._idx}])">← ${prev.latin}</button>` : '<span></span>'}
        ${next ? `<button class="detail-nav-btn next" onclick="goToEntry(DATA[${next._idx}])">${next.latin} →</button>` : '<span></span>'}
      </nav>
    </div>`;

  const art = document.getElementById('entry-' + entry._idx);
  if (art) {
    art.classList.add('pulse');
    setTimeout(() => art.classList.remove('pulse'), 1200);
  }
}

renderWotd();
render();
if (location.hash) applyEntryFromHash();
</script>
</body>
</html>
